<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lead Tafsilotlari</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Lead Tafsilotlari</h2>
        <ul class="list-group">
            <li class="list-group-item"><strong>Ism:</strong> {{ lead.name }}</li>
            <li class="list-group-item"><strong>Telefon:</strong> {{ lead.phone_number }}</li>
            <li class="list-group-item"><strong>Mebel turi:</strong> {{ lead.furniture_type }}</li>
            <li class="list-group-item"><strong>Yaratilgan:</strong> {{ lead.created_at|date:"Y-m-d H:i" }}</li>
        </ul>
        <a href="{% url 'custom_admin_panel' %}" class="btn btn-primary mt-3">Orqaga</a>
        <a href="{% url 'custom_admin_logout' %}" class="btn btn-danger mt-3">Chiqish</a>
    </div>
</body>
</html>
