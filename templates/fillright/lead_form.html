<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lead Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">Mebel buyurtma qilish</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Ismingiz</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Telefon raqam</label>
                <input type="text" name="phone_number" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Qanday mebel buyurtma qilmoqchisiz?</label>
                <select name="furniture_type" class="form-select" required>
                    <option value="oshxona">Oshxona mebeli</option>
                    <option value="yotoqxona">Yotoqxona mebeli</option>
                    <option value="bolalar">Bolalar mebeli</option>
                    <option value="yumshoq">Yumshoq mebellar</option>
                    <option value="shkaf">Shkaf va gardirob</option>
                    <option value="eshik">Eshiklar</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Yuborish</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
